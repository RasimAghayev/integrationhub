name: CI

on:
  push:
    branches: [preview, test, main]
  pull_request:
    branches: [preview, test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: integrationhub-ci
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Run Go lint
        run: |
          docker compose run --rm server /bin/sh -c "golangci-lint run ./... || true"

      - name: Run web lint
        run: |
          docker compose run --rm web /bin/sh -c "cd /app && npm run lint || true"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Run backend tests
        run: |
          docker compose run --rm server /bin/sh -c "go test ./..."

      - name: Run web tests
        run: |
          docker compose run --rm web /bin/sh -c "cd /app && npm test -- --run || true"

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./cmd/server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ github.sha }}

      - name: Build web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./web
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:${{ github.sha }}

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Run gosec
        run: |
          docker compose run --rm server /bin/sh -c "gosec ./... || true"

      - name: Run npm audit
        run: |
          docker compose run --rm web /bin/sh -c "cd /app && npm audit || true"

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@v0.22.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ github.sha }}
          skip-dirs: /node_modules
          skip-files: go.sum
          format: table
          exit-code: 1
