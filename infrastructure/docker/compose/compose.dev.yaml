services:
  postgres:
    image: postgres:16-alpine
    container_name: integrationhub-postgres
    environment:
      POSTGRES_DB: integrationhub
      POSTGRES_USER: integrationhub
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrationhub -d integrationhub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integrationhub

  mongodb:
    image: mongo:7-jammy
    container_name: integrationhub-mongodb
    environment:
      MONGO_INITDB_DATABASE: integrationhub
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_user
      - mongo_root_password
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integrationhub

  redis:
    image: redis:7-alpine
    container_name: integrationhub-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integrationhub

  nats:
    image: nats:2.10-alpine
    container_name: integrationhub-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "nats", "ping", "-s", "nats://localhost:4222"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integrationhub

  server:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    container_name: integrationhub-server
    environment:
      INTEGRATIONHUB_DB_HOST: postgres
      INTEGRATIONHUB_DB_PORT: 5432
      INTEGRATIONHUB_DB_USER: integrationhub
      INTEGRATIONHUB_DB_PASSWORD_FILE: /run/secrets/db_password
      INTEGRATIONHUB_DB_NAME: integrationhub
      INTEGRATIONHUB_MONGO_HOST: mongodb
      INTEGRATIONHUB_MONGO_PORT: 27017
      INTEGRATIONHUB_REDIS_ADDR: redis:6379
      INTEGRATIONHUB_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      INTEGRATIONHUB_NATS_URL: nats://nats:4222
      INTEGRATIONHUB_JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - integrationhub

  nginx:
    image: nginx:alpine
    container_name: integrationhub-nginx
    volumes:
      - ./infrastructure/docker/nginx:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - integrationhub

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  integrationhub:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password
  mongo_root_user:
    file: ./secrets/mongo_root_user
  mongo_root_password:
    file: ./secrets/mongo_root_password
  redis_password:
    file: ./secrets/redis_password
  jwt_secret:
    file: ./secrets/jwt_secret
